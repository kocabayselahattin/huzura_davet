org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# R8'in tam optimizasyon kipi. AGP 8'de varsayılan olarak açıktır; Play Console
# "R8 optimizasyonu" önerisine karşı açıkça sabitlenir.
android.enableR8.fullMode=true
# Play Console "kullanılmayan kaynakları kaldırma" uyarısına karşı: R8'in
# kaynakları da kod optimizasyon grafiğinin parçası sayıp kullanılmayanları
# silmesini sağlar (AGP 9.0'da varsayılan olacak, 8.6+'da opt-in bayrak).
android.r8.optimizedResourceShrinking=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
